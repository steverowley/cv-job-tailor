name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "wrangler.toml"
      - ".github/workflows/cloudflare-worker.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANALYSE_SHARED_SECRET: ${{ secrets.ANALYSE_SHARED_SECRET }}
      JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Deploy Worker
        run: npx wrangler deploy
      - name: Sync OpenAI API key
        if: ${{ env.OPENAI_API_KEY != '' }}
        run: echo "$OPENAI_API_KEY" | npx wrangler secret put OPENAI_API_KEY
      - name: Sync analyse shared secret
        if: ${{ env.ANALYSE_SHARED_SECRET != '' }}
        run: echo "$ANALYSE_SHARED_SECRET" | npx wrangler secret put ANALYSE_SHARED_SECRET
      - name: Sync Jina API key
        if: ${{ env.JINA_API_KEY != '' }}
        run: echo "$JINA_API_KEY" | npx wrangler secret put JINA_API_KEY
      - name: Verify OpenAI secret
        if: ${{ env.OPENAI_API_KEY != '' }}
        run: npx wrangler secret list | grep OPENAI_API_KEY
