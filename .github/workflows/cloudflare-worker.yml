name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "wrangler.toml"
      - ".github/workflows/cloudflare-worker.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANALYSE_SHARED_SECRET: ${{ secrets.ANALYSE_SHARED_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Deploy Worker
        run: npx wrangler deploy
      - name: Sync Anthropic API key
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        run: echo "$ANTHROPIC_API_KEY" | npx wrangler secret put ANTHROPIC_API_KEY
      - name: Sync analyse shared secret
        if: ${{ env.ANALYSE_SHARED_SECRET != '' }}
        run: echo "$ANALYSE_SHARED_SECRET" | npx wrangler secret put ANALYSE_SHARED_SECRET
      - name: Verify Anthropic secret
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        run: npx wrangler secret list | grep ANTHROPIC_API_KEY
